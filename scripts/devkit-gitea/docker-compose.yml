version: "3.3"

networks:
  default:
    external:
      name: ${APP_NAME}

services:

  gitea:
    image: registry.cn-hangzhou.aliyuncs.com/huangyalong/gitea:1.27.3
    container_name: ${APP_NAME}-gitea
    ports:
      - "${GITEA_WEB_PORT}:3000"
      - "${GITEA_SSH_PORT}:22"
    environment:
      - "GITEA__database__DB_TYPE=mysql"
      - "GITEA__database__HOST=${APP_NAME}-mysql:3306"
      - "GITEA__database__NAME=gitea"
      - "GITEA__database__USER=root"
      - "GITEA__database__PASSWD=${MYSQL_PASSWORD}"
      - "GITEA__server__SSH_PORT=${GITEA_SSH_PORT}"
      - "USER_UID=1000"
      - "USER_GID=1000"
      - "TZ=Asia/Shanghai"
    volumes:
      - "$PWD/data:/data"
    restart: unless-stopped
